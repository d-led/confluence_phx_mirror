# Local development services only: Postgres for the app, Adminer to look inside
# it, smtp4dev as the mail sink. The application itself is deployed as a
# release and needs none of this — see docs/deployment.md.
#
# Images are pinned rather than floating: Postgres 17 is the version CI runs and
# the one the suite was written against, so bump it in .github/workflows/ci.yml
# and here together. The other two are pinned to the release they were tried
# with, and dabbling in a newer tag is then a deliberate act.

services:

  postgres:
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - data-postgres:/var/lib/postgresql/data

  # http://localhost:8092/?pgsql=postgres&username=postgres&db=postgres&ns=public
  # Multi-arch: no `platform:` override, so an Apple Silicon laptop runs it
  # natively instead of emulating amd64.
  adminer:
    image: adminer:6.1.2
    links:
      - postgres
    ports:
      - 8092:8080

  # SMTP sink for development. Web UI: http://localhost:3001
  smtp4dev:
    image: rnwood/smtp4dev:3.15.0
    # restart: always
    ports:
      - 3001:80
      - 2525:25

volumes:
  data-postgres:
