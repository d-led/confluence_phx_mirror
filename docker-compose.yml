# Local development services only: Postgres for the app, Adminer to look inside
# it, smtp4dev as the mail sink. The application itself is deployed as a
# release and needs none of this — see docs/operations.md.

services:

  postgres:
    image: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - data-postgres:/var/lib/postgresql/data

  # http://localhost:8092/?pgsql=postgres&username=postgres&db=postgres&ns=public
  adminer:
    image: adminer
    platform: linux/amd64
    links:
      - postgres
    ports:
      - 8092:8080

  # SMTP sink for development. Web UI: http://localhost:3001
  smtp4dev:
    image: rnwood/smtp4dev
    # restart: always
    ports:
      - 3001:80
      - 2525:25

volumes:
  data-postgres:
