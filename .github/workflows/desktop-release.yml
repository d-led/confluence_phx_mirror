# Publishes the desktop tool: an installable app from every push, and a release
# from a version tag.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Every push builds one too, kept for 90 days, because the newest build of a
# branch is what somebody installs — there is no release to wait for:
#
#   curl -fsSL https://raw.githubusercontent.com/d-led/confluence_phx_mirror/main/install-desktop.sh | sh
#   powershell -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/d-led/confluence_phx_mirror/main/install-desktop.ps1 | iex"
#
# The scripts read the newest artifact through `nightly.link`, which serves
# `<workflow>/<branch>/<artifact>.zip` for the last successful run:
#
#   https://nightly.link/d-led/confluence_phx_mirror/workflows/desktop-release/main/confluence-export-macos.zip
#
# That zip is a wrapper: what is inside it is the artifact, and the macOS and
# Linux artifacts are archives themselves. `install-desktop.sh` unpacks both
# layers — an installer that assumed one said the app was missing, which is how
# that bug was found — while the Windows artifact is the folder itself.
#
# What the macOS one holds is **the application bundle**: `Confluence Export.app`,
# zipped with `ditto` because a bundle is directories, symlinks and extended
# attributes and the ones a plain `zip` drops are the ones that stop it
# launching. The bundle carries the window, the sidecar release (copied into
# `Contents/Resources/rel` by `scripts/package.sh` — not through
# `bundle.resources`, which fails on this toolchain) and the icon, so it runs
# where this checkout is not — drag it to `/Applications` and double-click.
#
# It is not signed, so Gatekeeper refuses the first launch of a downloaded copy
# until somebody right-clicks → Open. Signing and notarisation are their own
# piece of work, and a workflow that produced a signed-looking app nobody had run
# would be worse than one that ships an honest unsigned bundle.
#
# Three platforms, three shapes of artifact, one script:
#
#   macOS    `Confluence Export.app`, zipped with `ditto` — a bundle is
#            directories, symlinks and extended attributes, and a plain `zip`
#            drops the ones that stop it launching.
#   Linux    `confluence-export-linux.tar.gz`: the window plus `rel/` beside it,
#            built on 22.04 so the glibc floor is a known one.
#   Windows  a folder that `upload-artifact` zips: `confluence-export.exe` with
#            `rel\` beside it, which is what `resource_dir()` means there — plus,
#            when the NSIS bundler produces one, `confluence-export-windows-setup.exe`,
#            the same build as an installer somebody double-clicks.
#
# Every platform runs the same `scripts/package.sh`, boot check included: a
# build that cannot serve `/health` and `/__tool` out of the artifact it just
# wrote is a download that opens on nothing, and that gate is what stops one
# from being published. None of the three is signed; `docs/desktop-tool.md` says
# what that means for a person installing one.

name: desktop-release

on:
  push:
    # `main` and tags, not every branch. `["**"]` meant a three-platform build
    # — macOS, Linux and Windows, each with cargo, the release and an installer —
    # for every branch pushed to this repository, dependabot's included, and the
    # bill arrived long before anybody looked at what it bought. A branch that
    # needs an installable build asks for one with `workflow_dispatch`, which is
    # what it always was: a deliberate act.
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  # A superseded branch build is wasted work; a half-uploaded release is worse
  # than a slow one, so a tag is never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MIX_ENV: desktop
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the other two: the point of the matrix
      # is to find out which one broke.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: confluence-export-macos
            path: _build/desktop/package/confluence-export-macos.zip
          # 22.04, not `ubuntu-latest`: the glibc a build links against is the
          # floor an installed copy needs, and `latest` moves.
          - os: ubuntu-22.04
            name: Linux
            artifact: confluence-export-linux
            path: _build/desktop/package/confluence-export-linux.tar.gz
          - os: windows-latest
            name: Windows
            artifact: confluence-export-windows
            # A folder, not an archive: `upload-artifact` zips it, and a
            # Windows runner has no `tar` we should depend on. The download is
            # `confluence-export.exe` with `rel\` beside it.
            #
            # The upload path is the folder that *contains* it, because
            # `upload-artifact` treats a directory's own path as the zip's root:
            # pointing it at the folder itself unpacks the `.exe`, the note and
            # `rel\` loose into whatever directory a person unzips in.
            #
            # That folder is made in the runner's temp directory, and its path is
            # therefore set at the upload step rather than here: a matrix value
            # cannot read the `runner` context. It sits outside `_build`, which
            # this workflow caches — a restored `_build` carried the folder a
            # previous run had moved there, and moving onto a directory that
            # already has contents fails ("Directory not empty").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # What the *window* links against (Tauri's prerequisites): WebKitGTK for
      # the webview, GTK for the window, rsvg and appindicator because Tauri
      # links them whether or not the app uses a tray icon. The release in
      # `rel/` needs none of this — it carries its own Erlang.
      - name: Install the window's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xvfb

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `~/.cargo/registry` and `~/.cargo/git` are the *downloads*: the three
          # heavy paths below only help while this key matches, and the key
          # carries `hashFiles('src-tauri/Cargo.lock')` — so the one run that
          # changes a dependency rebuilt the crate graph from nothing and fetched
          # every tarball again. With the registry cached, a miss is a compile
          # and not a download.
          path: |
            deps
            _build/desktop
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-release-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-release-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      # `mix esbuild` only bundles the JavaScript; the packages it bundles are
      # npm's — `js/code_highlight.js` imports highlight.js' grammars — and
      # `mix assets.install` fetches the esbuild and tailwind *binaries*, not
      # `assets/node_modules`. Without this the bundle build dies on "Could not
      # resolve \"highlight.js/lib/languages/diff\"", which is what it did on
      # every run before this step existed. The lockfile pins the versions and
      # the runner's own Node is enough, as in `ci.yml`.
      - name: Install the assets' npm packages
        run: npm ci --no-audit --no-fund
        working-directory: assets

      # `cargo tauri` needs the CLI, and a runner starts without it. Cached on
      # the version it installs, which is the only thing that changes it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2-${{ runner.os }}

      # `bash` explicitly: the Windows runner's default shell is PowerShell,
      # where `> /dev/null` does not mean "throw the output away" — it means
      # "write a file called null beside the workspace", and this step failed with
      # `Could not find a part of the path 'D:\dev\null'` on every Windows run
      # until it said so.
      - name: Install the Tauri CLI (when the cache misses)
        shell: bash
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked

      # The window's own logic, on the platform whose branches nothing else
      # compiles: `ci.yml` tests this crate on Linux, where `cmd`/`call`, the
      # separator normalising and the `.bat` name are different functions. The
      # first Windows launch of this tool failed on exactly that difference —
      # `cannot get boot file` — so the code that builds the path is tested where
      # it runs.
      - name: Test the window on the platform it ships to
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # One script, not a second implementation of it. The steps used to be
      # spelled out here — assets, release, window, bundle, boot check, zip — and
      # they drifted: this workflow zipped the window *without* carrying the
      # release into `Contents/Resources/rel`, and its boot check ran
      # `_build/desktop/rel` instead of the copy inside the bundle, so a green run
      # published a 2 MB app whose window could not start anything. `package.sh`
      # is what a person runs locally, and it does all of it — including whether
      # the release *the artifact carries* answers `/health` and `/__tool`.
      #
      # `bash` explicitly, because on Windows the runner's default is PowerShell
      # and this is one script for all three.
      - name: Package (build, carry the release, boot check, assemble)
        shell: bash
        run: scripts/package.sh

      # What a person actually runs: the artifact, unpacked, with the release
      # inside it started the way the window starts one. `scripts/package.sh`
      # boots the staging folder; this boots the tarball, which is the only shape
      # tested on the machine it ships to. It is not redundant with that check —
      # an amd64 container on an Apple-silicon machine fails this boot in OTP's
      # `prim_tty` NIF while the staging folder serves, so the two disagree about
      # exactly the thing worth knowing (`docs/desktop-tool.md`, "Linux, and why
      # an emulated container lies about it").
      #
      # It runs after the uploads, like the window checks below: a failing check
      # is a fact worth reporting and not a reason to withhold the download.

      # The zip a person downloads has to unpack into one folder, and
      # `upload-artifact` zips a directory's *contents*. So the folder is given
      # the parent that becomes the zip's root. A move, not a copy: same volume,
      # 165 MB renamed rather than duplicated.
      - name: Give the Windows folder the name it unpacks into
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/unpack"
          mkdir -p "$RUNNER_TEMP/unpack"
          mv _build/desktop/package/confluence-export-windows "$RUNNER_TEMP/unpack/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          # Windows has no `path` in the matrix (see the comment there); its
          # artifact is the folder staged in the runner's temp directory.
          path: ${{ matrix.path || format('{0}/unpack', runner.temp) }}
          # `nightly.link` serves the newest artifact of a branch, and an
          # installed build should keep working for a while: a week is not long
          # enough for that promise.
          retention-days: 90
          if-no-files-found: error

      # The same build in the shape a Windows person expects: one file to
      # double-click, which puts the app under `%LOCALAPPDATA%\Programs` and the
      # release beside it. Not fatal when it is absent — the portable folder is a
      # complete install — but a build that has one publishes it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: confluence-export-windows-setup
          path: _build/desktop/package/confluence-export-windows-setup.exe
          retention-days: 90
          if-no-files-found: warn

      - name: Boot the unpacked artifact, as the window would
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/home"
          tar -xzf _build/desktop/package/confluence-export-linux.tar.gz -C "$work"
          release="$work/confluence-export-linux/rel/confluence_phx_mirror"
          log="$work/boot.log"

          HOME="$work/home" RELEASE_DISTRIBUTION=none CONFLUENCE_EXPORT_PORT=43999 \
            "$release/bin/confluence_phx_mirror" start </dev/null >"$log" 2>&1 &
          pid=$!

          url=""
          for _ in $(seq 1 40); do
            url=$(sed -n 's/^desktop ui: //p' "$log" | head -1)
            [ -n "$url" ] && break
            sleep 1
          done

          if [ -z "$url" ]; then
            echo "the unpacked artifact never announced a port — what it said:"
            cat "$log"
            kill "$pid" 2>/dev/null || true
            exit 1
          fi

          echo "the unpacked artifact serves ${url%/}"
          curl -fsS "${url%/}/health" >/dev/null
          curl -fsS "${url%/}/__tool" >/dev/null

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      # The window itself, and *after* the uploads on purpose: a check that fails
      # is a fact worth reporting, and it is not a reason to withhold the download
      # from somebody waiting for one. The other order did exactly that — the
      # Windows package was built, and a failed window check meant it was never
      # published.
      #
      # Every check before this one asks the *server* a question, and all of them
      # were green while the window judged its own splash page a foreign link,
      # opened a console window and the default browser instead, and showed the
      # person nothing at all — the shape that shipped. This opens the executable
      # a person downloads and waits for it to report the screen it painted.
      - name: Open the window that was just built
        shell: bash
        run: |
          # Windows' portable folder lives in the runner's temp directory by now
          # (the step above moved it there so its zip unpacks into one folder).
          if [[ $RUNNER_OS == Windows ]]; then
            scripts/smoke-window.sh \
              --window "$RUNNER_TEMP/unpack/confluence-export-windows/confluence-export.exe"
          else
            scripts/smoke-window.sh
          fi

      # The installer is the shape a Windows person actually uses, and until now
      # the one shape nothing had ever opened: the checks above look at the
      # portable folder, whose `rel\` is assembled by `scripts/package.sh`, while
      # the installed copy gets its `rel\` from the bundler's resource copy. A
      # download that installs fine and then crashes on start is exactly the
      # difference between those two, so the installed window is opened too.
      - name: Install the Windows package and open the installed window
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./_build/desktop/package/confluence-export-windows-setup.exe /S

          # The install directory follows `productName`, and the executable's
          # name follows the crate — so it is found rather than assumed, and a
          # package that installs nothing says so instead of timing out.
          installed=$(find "$LOCALAPPDATA" -maxdepth 3 -type f -iname "confluence*.exe" \
            ! -iname "*uninstall*" | head -1)

          if [ -z "$installed" ]; then
            echo "the installer put no window under $LOCALAPPDATA:" >&2
            find "$LOCALAPPDATA" -maxdepth 2 -iname "*confluence*" >&2 || true
            exit 1
          fi

          echo "installed: $installed"
          ls "$(dirname "$installed")" || true

          scripts/smoke-window.sh --window "$installed"

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Attach every platform to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" --generate-notes \
              --repo "$GITHUB_REPOSITORY"

          # One name per platform, because three files all called
          # `confluence-export.zip` is a download nobody can identify later.
          for platform in macos linux windows; do
            case "$platform" in
              macos) src="dist/confluence-export-macos/confluence-export-macos.zip" ;;
              linux) src="dist/confluence-export-linux/confluence-export-linux.tar.gz" ;;
              windows) src="dist/confluence-export-windows/confluence-export-windows.zip" ;;
            esac
            ext="${src##*.}"
            asset="confluence-export-${tag}-${platform}.${ext}"
            mv "$src" "$asset"
            ls -lh "$asset"
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          done

          # The Windows installer, when the run built one: a `.exe` is the
          # download that needs no unpacking, and it is the only artifact here
          # that installs rather than sits in a folder.
          setup="dist/confluence-export-windows-setup/confluence-export-windows-setup.exe"
          if [[ -f $setup ]]; then
            asset="confluence-export-${tag}-windows-setup.exe"
            mv "$setup" "$asset"
            ls -lh "$asset"
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "this run produced no Windows installer"
          fi
