# Publishes the desktop tool: an installable app from every push, and a release
# from a version tag.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Every push builds one too, kept for 90 days, because the newest build of a
# branch is what somebody installs — there is no release to wait for:
#
#   curl -fsSL https://raw.githubusercontent.com/d-led/confluence_phx_mirror/main/install-desktop.sh | sh
#
# The script reads the newest artifact through `nightly.link`, which serves
# `<workflow>/<branch>/<artifact>.zip` for the last successful run:
#
#   https://nightly.link/d-led/confluence_phx_mirror/workflows/desktop-release/main/confluence-export-macos.zip
#
# What it holds is **the application bundle**: `Confluence Export.app`, zipped
# with `ditto` because a bundle is directories, symlinks and extended attributes
# and the ones a plain `zip` drops are the ones that stop it launching. The
# bundle carries the window, the sidecar release (as `bundle.resources`) and the
# icon, so it runs where this checkout is not — drag it to `/Applications` and
# double-click.
#
# It is not signed, so Gatekeeper refuses the first launch of a downloaded copy
# until somebody right-clicks → Open. Signing and notarisation are their own
# piece of work, and a workflow that produced a signed-looking app nobody had run
# would be worse than one that ships an honest unsigned bundle.
#
# The build is macOS only for the same reason as the debug workflow: it is the
# platform the window has actually been run on.

name: desktop-release

on:
  push:
    # Every branch, `main` included: the newest build of a branch is installable,
    # and a build that only happens on a tag is a build nobody has run.
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  # A superseded branch build is wasted work; a half-uploaded release is worse
  # than a slow one, so a tag is never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MIX_ENV: desktop
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"

jobs:
  package:
    name: package (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/desktop
            src-tauri/target
          key: desktop-release-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-release-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      # `mix esbuild` only bundles the JavaScript; the packages it bundles are
      # npm's — `js/code_highlight.js` imports highlight.js' grammars — and
      # `mix assets.install` fetches the esbuild and tailwind *binaries*, not
      # `assets/node_modules`. Without this the bundle build dies on "Could not
      # resolve \"highlight.js/lib/languages/diff\"", which is what it did on
      # every run before this step existed. The lockfile pins the versions and
      # the runner's own Node is enough, as in `ci.yml`.
      - name: Install the assets' npm packages
        run: npm ci --no-audit --no-fund
        working-directory: assets

      # A release ships whatever `priv/static` holds and never builds it, and
      # `priv/static/assets` is not in the repository. Built here, or the download
      # opens unstyled, with "unknown hook found" in its console and menus that do
      # not open — the same four steps `scripts/package.sh` runs locally.
      - name: Build the assets
        run: |
          mix assets.install --if-missing
          mix tailwind confluence_phx_mirror --minify
          mix esbuild confluence_phx_mirror --minify
          mix esbuild confluence_phx_mirror_swagger --minify
          mix phx.digest

      - name: Build the release
        env:
          # Signs every BEAM binary and escript in the release — the half Tauri
          # cannot sign for itself. Ad-hoc without an identity; with
          # `APPLE_SIGNING_IDENTITY` in the secrets it is a real signature, and
          # Tauri then signs and notarises the app around it.
          CONFLUENCE_SIGN_RELEASE: "1"
        run: mix release --overwrite

      - name: Build the window
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      # `cargo tauri` needs the CLI, and a runner starts without it. Cached on
      # the version it installs, which is the only thing that changes it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2-${{ runner.os }}

      - name: Install the Tauri CLI (when the cache misses)
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked

      # The application bundle: the window, the release as a resource, and the
      # icon, in one double-clickable package. `tauri.bundle.conf.json` is
      # merged here only — `bundle.active` in the main config breaks the debug
      # window `desktop-debug` builds.
      - name: Build the application bundle
        run: cargo tauri build --bundles app --config "$PWD/src-tauri/tauri.bundle.conf.json"

      # A release that builds but does not boot is not a release. This is the
      # same check the debug workflow makes, and it runs before anything is
      # published.
      - name: Boot the release and check it serves
        run: |
          set -euo pipefail
          bin=_build/desktop/rel/confluence_phx_mirror/bin/confluence_phx_mirror
          log=$(mktemp)
          "$bin" start >"$log" 2>&1 &
          trap '"$bin" stop >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            url=$(sed -n 's/^desktop ui: //p' "$log" | head -1)
            [ -n "$url" ] && break
            sleep 1
          done

          [ -n "$url" ] || { echo "the release never said where it listens"; cat "$log"; exit 1; }

          # The address it prints ends with a slash, and `//__tool` is a
          # different path from `/__tool` — one the endpoint answers with a 404.
          url=${url%/}

          # Both halves: the mirror's own health, and the tool's screen, which is
          # the part this build adds. A release that serves one and not the other
          # is a download that opens on nothing.
          curl -fsS "$url/health"
          curl -fsS "$url/__tool"

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p dist
          app="src-tauri/target/release/bundle/macos/Confluence Export.app"

          # `ditto`, not `zip`: a bundle is directories, symlinks and extended
          # attributes, and the ones `zip` drops are the ones that stop it
          # launching.
          ditto -c -k --keepParent "$app" dist/confluence-export-macos.zip

          # Prove the promise: the bundle is inside, executable included. The
          # listing is compared, not piped into `grep -q`: that exits at the first
          # match, `unzip` takes the SIGPIPE, and `pipefail` reads 141 as a
          # failure.
          listing=$(unzip -l dist/confluence-export-macos.zip)
          case "$listing" in
            *"Confluence Export.app/Contents/MacOS/confluence-export"*) ;;
            *) echo "the zip does not carry the bundle"; echo "$listing" | head -20; exit 1 ;;
          esac
          ls -lh dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confluence-export-macos
          path: dist/confluence-export-macos.zip
          # `nightly.link` serves the newest artifact of a branch, and an
          # installed build should keep working for a while: a week is not long
          # enough for that promise.
          retention-days: 90
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          path: dist

      - name: Attach the bundle to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="confluence-export-${tag}-macos.zip"
          mv "dist/confluence-export-macos.zip" "$asset"
          ls -lh "$asset"

          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" --generate-notes \
              --repo "$GITHUB_REPOSITORY"

          gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
