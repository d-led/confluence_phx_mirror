# Builds the desktop tool on every branch commit, so a change that breaks the
# release or the window is found on the branch that broke it rather than at a
# release.
#
# Two artefacts, both debug:
#
#   release  the Elixir sidecar, `MIX_ENV=desktop mix release`. This is what
#            catches a `lib_desktop` module that compiles in dev but not in a
#            release — the code path a person actually installs.
#   window   `cargo build` of `src-tauri`. It compiles the Rust crate that
#            spawns the sidecar and builds the webview window.
#
# Neither is a packaging step: there is no `.app` yet and no signing. What this
# proves is that both halves build from a clean checkout on a runner that has
# never seen the repository — which is the thing that quietly stops working when
# a dependency is optional in `mix.exs` and only present on a developer machine.
#
# macOS only, for now, because that is the platform the window has been built
# and run on. Adding a platform is a matrix entry plus its system libraries
# (Linux needs webkit2gtk; Windows needs nothing beyond the runner), and is
# worth doing when someone is ready to test the result.
#
# **Now three platforms.** The reason to add them here rather than only in the
# release workflow is speed: this job builds the two halves and boots the
# release, which is minutes, and a Windows compile error found here costs a
# branch push instead of a release-size round trip. `desktop-release.yml` runs
# the same script with packaging on top.

name: desktop-debug

on:
  push:
    # Every branch, `main` included: a desktop build that only runs on feature
    # branches stops being built exactly when a change lands.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-debug-${{ github.workflow }}-${{ github.ref }}
  # Only the newest commit of a branch is worth building.
  cancel-in-progress: true

env:
  MIX_ENV: desktop
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"

jobs:
  build:
    name: build (debug, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # The window links these; the release in `rel/` needs none of them.
      - name: Install the window's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      # `lib_desktop` is compiled only in this environment, so the cache has to
      # be keyed by it as well as by the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/desktop
            src-tauri/target
          key: desktop-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # `ecto_sqlite3` and `rustler` are `only: :desktop`, so this is a different
      # dependency set from the server's — it is not the same as `mix deps.get`.
      - name: Fetch dependencies
        run: mix deps.get

      # A restored cache can carry Rustler's stamps without the library it built,
      # and then `mix compile` has nothing to do and the release boots into
      # `on_load_function_failed` on the keyring NIF — which is exactly how this
      # job failed once. Ask the file, not the stamps. The extension is the
      # platform's (`confluence_keyring.so` on Unix, `.dll` on Windows).
      - name: Build the release
        shell: bash
        run: |
          set -euo pipefail
          compgen -G "_build/desktop/lib/confluence_phx_mirror/priv/native/confluence_keyring.*" >/dev/null ||
            mix compile --force
          mix release --overwrite

      - name: Build the window
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # A release that builds but cannot boot is not much of a signal, and boot
      # is where a missing `:persistent_term` or a Swoosh client shows up.
      #
      # `bash` on every platform: the release's launcher is `bin/<name>` on Unix
      # and `bin/<name>.bat` on Windows, and the latter is not an executable —
      # `CreateProcess` refuses one, so it goes through `cmd /C`.
      - name: Boot the release and check it serves
        shell: bash
        run: |
          set -euo pipefail
          dir=_build/desktop/rel/confluence_phx_mirror/bin
          log=$(mktemp)

          case "$(uname -s)" in
            MINGW* | MSYS* | CYGWIN*) bin="$dir/confluence_phx_mirror.bat" ;;
            *) bin="$dir/confluence_phx_mirror" ;;
          esac

          case "$(uname -s)" in
            MINGW* | MSYS* | CYGWIN*)
              RELEASE_DISTRIBUTION=none "$COMSPEC" //C "$bin" start >"$log" 2>&1 &
              ;;
            *)
              RELEASE_DISTRIBUTION=none "$bin" start >"$log" 2>&1 &
              ;;
          esac
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$log"' EXIT

          for _ in $(seq 1 60); do
            url=$(sed -n 's/^desktop ui: //p' "$log" | head -1)
            [ -n "$url" ] && break
            sleep 1
          done

          [ -n "$url" ] || { echo "the release never said where it listens"; exit 1; }
          echo "serving at $url"

          # The address ends in a slash, so `$url/state` is `//state` — a path the
          # endpoint answers with 404, which is how this step failed on every run
          # until it was asked for something that exists. `/state` is not the
          # tool's either: its screens live under `/__tool`. Two halves, then:
          # the mirror's health, and the tool's own screen.
          curl -fsS "${url%/}/health" >/dev/null
          curl -fsS -o /dev/null "${url%/}/__tool"
          echo

      - name: Keep the window binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: confluence-export-${{ runner.os }}-${{ github.sha }}
          path: |
            src-tauri/target/debug/confluence-export
            src-tauri/target/debug/confluence-export.exe
          if-no-files-found: error
          retention-days: 7
