# The gates a change has to pass before it lands on main: static analysis, the
# suite with the complexity ranking it feeds, and the container image — built,
# scanned, and run as the unprivileged user it claims to run as.
#
#   lint    a few seconds, no database: compile --warnings-as-errors, unused
#           deps, formatting, credo --strict, sobelow. Fails fastest.
#   test    Postgres service, `mix cover` (test --cover), then `mix complexity`,
#           which reads the coverage the suite exported and scores every
#           function by complexity and coverage.
#   image   `docker build`, Trivy on the result, and a run as uid 10001.
#           Published to GHCR from main and from version tags.
#
# The quality script that developers run (scripts/quality.sh) is the same three
# gates in one report, so a green laptop and a green pipeline mean the same
# thing.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: lint-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # compile --warnings-as-errors, deps.unlock --check-unused,
      # format --check-formatted, credo --strict, sobelow --config
      - run: mix lint

  test:
    name: Suite and complexity
    runs-on: ubuntu-latest
    # Matches the development database version, so a migration that only works
    # on one Postgres fails here rather than in production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # `mix cover` = test --cover --export-coverage default; the coverage it
      # exports is what the CRAP ranking below reads.
      - name: Suite with coverage
        run: mix cover
      - name: Complexity (CRAP) ranking
        run: mix complexity
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            cover/
            default.coverdata
          if-no-files-found: ignore
          retention-days: 14

  image:
    name: Image, scan, non-root
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Work out the tags
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref="${image}:${GITHUB_SHA::12}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS"
            echo "${ref}"
            case "${GITHUB_REF}" in
              refs/heads/main) echo "${image}:latest" ;;
              refs/tags/v*) echo "${image}:${GITHUB_REF#refs/tags/}" ;;
            esac
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Loaded locally as well as pushed: Trivy and the uid check then see
          # the same bytes that go to GHCR.
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CI_PROVIDER=github
            CI_WORKFLOW=${{ github.workflow }}
            CI_RUN_NUMBER=${{ github.run_number }}
            CI_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          # Only what this project can act on: a fixable OS package or library.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Run as an unprivileged user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint /usr/bin/id "${{ steps.image.outputs.ref }}" -u)
          echo "image runs as uid ${uid}"
          test "${uid}" -ne 0
          test "${uid}" = "10001"
