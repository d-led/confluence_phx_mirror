# The gates a change has to pass before it lands on main: static analysis, the
# suite with the complexity ranking it feeds, and the container image — built,
# scanned, and run as the unprivileged user it claims to run as.
#
#   lint    a few seconds, no database: compile --warnings-as-errors, unused
#           deps, formatting, credo --strict, sobelow. Fails fastest. Every push
#           and every pull request.
#   types   dialyzer against a PLT of OTP, Elixir and the deps: every spec
#           against the code that has to keep it. Its own job because the PLT is
#           two minutes cold and ten seconds warm, which would spoil the lint
#           gate's promise; the `_build` cache carries the PLT between runs.
#   test    Postgres service, `mix cover` (test --cover), then `mix complexity`,
#           which reads the coverage the suite exported and scores every
#           function by complexity and coverage. Every push and every pull
#           request; about eight minutes, which is the whole run now.
#   image   `docker build`, Trivy on the result, and a run as uid 10001, then
#           the image is published to GHCR under the branch or tag name:
#           `:main` (and `:latest`) for main, `:v1.2.3` for a release, never a
#           commit hash. A push publishes the amd64 image the checks had to
#           build anyway; the amd64 + arm64 index waits for a release tag or a
#           dispatch that asks for it. It waits for the two gates above
#           (`needs`), so nothing is published from a commit that failed them.
#
# The arm64 half is by far the expensive part — 14 m 41 s under QEMU, 17
# minutes for the whole job on a warm cache — and it is the part whose breakage
# a developer finds in a couple of minutes with `docker build .` at home. So a
# push publishes amd64, and asking for the index costs:
#
#   gh workflow run ci --ref main --field image=true
#
# `scripts/quality.sh --image` is the same build and uid check locally; the Trivy
# scan stays here, where it is fourteen seconds rather than a database download.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "Also build, scan, start and publish the image (the expensive half)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push that has been superseded by the next one is not worth eight minutes
  # of a shared runner: only the newest commit of a branch is built. Nothing is
  # lost — a cancelled run publishes nothing (the image is a release step) and
  # the next run is the newer commit.
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"

jobs:
  lint:
    name: Static analysis
    # Pinned, not `ubuntu-latest`: the label now moves to Ubuntu 26 on its own
    # schedule, and a toolchain that changes under a green pipeline is not a
    # gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: lint-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # compile --warnings-as-errors, deps.unlock --check-unused,
      # format --check-formatted, credo --strict, lint.sobelow --config (sobelow,
      # with the quoted-key warning it provokes from mix.lock attributed rather
      # than printed as ours)
      - run: mix lint

  types:
    name: Types (dialyzer)
    runs-on: ubuntu-24.04
    # Two minutes of PLT on a miss, ten seconds on a hit, plus the compile.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      # Keyed on mix.lock as well as the toolchain: a new dep belongs in the PLT,
      # and a restore from an older key is then rebuilt rather than trusted.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: types-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            types-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # mix types = dialyzer. Nothing to read by hand: a finding is a lib/ path,
      # a line and what does not add up, and the job fails on the first one.
      - run: mix types

  test:
    name: Suite and complexity
    runs-on: ubuntu-24.04
    # The suite is 4 minutes on a laptop and can take 12 on a cold runner. A
    # hung VM should fail the gate, not occupy it for GitHub's six-hour default.
    timeout-minutes: 40
    # Matches the development database version, so a migration that only works
    # on one Postgres fails here rather than in production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # `mix cover` = test --cover --export-coverage default; the coverage it
      # exports is what the CRAP ranking below reads.
      - name: Suite with coverage
        run: mix cover
      - name: Complexity (CRAP) ranking
        run: mix complexity
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            cover/
            default.coverdata
          if-no-files-found: ignore
          retention-days: 14

  image:
    name: Image, scan, non-root, publish
    needs: [lint, types, test]
    runs-on: ubuntu-24.04
    # The arm64 half is built under QEMU, which is the slow part.
    timeout-minutes: 45
    # The point of a gate is that the thing behind it cannot be reached before
    # it opens: the image is built, scanned and pushed only for a commit that
    # passed static analysis and the suite. A push publishes the amd64 image
    # the checks already built; a release tag, or a dispatch that asks for it,
    # also pays for the arm64 half and publishes the index. A pull request is
    # neither, so it publishes nothing.
    if: github.event_name == 'push' || inputs.image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Work out the tag
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          # Branch or tag name, and nothing else: `:main` moves with the
          # branch, `:v1.2.3` is the release. A commit tag would leave a new
          # image behind on every push and still not say which branch it came
          # from, so there are none.
          tag=$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g')

          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS"
            echo "${image}:${tag}"
            # main also answers to `latest`, so a deployment can follow either
            # the branch's name or the usual one.
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${image}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

          # The index is what an arm64 machine pulls natively, and building its
          # half means compiling the release under QEMU — 14 minutes of the
          # job. A push says nothing about wanting that, so it publishes the
          # amd64 image the checks built; a tag or a dispatch asks for both.
          if [ "${{ inputs.image || startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
      # Built for the runner's own architecture so Trivy and the uid check read
      # a real image rather than a manifest list — and so those two checks stay
      # fast. This is the amd64 half of what is published below.
      - name: Build linux/amd64 for the checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            # The ref, which is also the image tag: `main`, `v1.2.3`.
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CI_PROVIDER=github
            CI_WORKFLOW=${{ github.workflow }}
            CI_RUN_NUMBER=${{ github.run_number }}
            CI_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          # Only what this project can act on: a fixable OS package or library.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Run as an unprivileged user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint /usr/bin/id "${{ steps.image.outputs.ref }}" -u)
          echo "image runs as uid ${uid}"
          test "${uid}" -ne 0
          test "${uid}" = "10001"
      # One image per published tag. For a release (or a dispatch) it carries
      # both architectures: an Apple Silicon laptop or an arm64 VM pulls a
      # native build, x86 servers pull theirs. arm64 is compiled here, under
      # QEMU, which is why only that path pays for it.
      - name: Set up QEMU for the arm64 build
        if: steps.image.outputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Publish ${{ steps.image.outputs.platforms }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ steps.image.outputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CI_PROVIDER=github
            CI_WORKFLOW=${{ github.workflow }}
            CI_RUN_NUMBER=${{ github.run_number }}
            CI_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
