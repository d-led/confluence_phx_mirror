# The gates a change has to pass before it lands on main: static analysis, the
# suite with the complexity ranking it feeds, and the container image — built,
# scanned, and run as the unprivileged user it claims to run as.
#
#   lint    a few seconds, no database: compile --warnings-as-errors, unused
#           deps, formatting, credo --strict, sobelow. Fails fastest.
#   test    Postgres service, `mix cover` (test --cover), then `mix complexity`,
#           which reads the coverage the suite exported and scores every
#           function by complexity and coverage.
#   image   `docker build`, Trivy on the result, and a run as uid 10001.
#           Published to GHCR under the branch or tag name: `:main` (and
#           `:latest`) for main, `:v1.2.3` for a release tag, never a commit
#           hash. What is scanned and started here is the branch's own tag, so
#           a later stage that pulls `:main` is testing the same image.
#           It waits for the two gates above (`needs`), so nothing is published
#           from a commit that failed them — otherwise `:main` would mean "the
#           last push", not "the last commit that passed".
#
# The quality script that developers run (scripts/quality.sh) is the same three
# gates in one report, so a green laptop and a green pipeline mean the same
# thing.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push that has been superseded by the next one is not worth twelve
  # minutes of a shared runner: only the newest commit of a branch is built.
  # Nothing is lost — the image is published from that commit, not from this
  # run's.
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"

jobs:
  lint:
    name: Static analysis
    # Pinned, not `ubuntu-latest`: the label now moves to Ubuntu 26 on its own
    # schedule, and a toolchain that changes under a green pipeline is not a
    # gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: lint-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # compile --warnings-as-errors, deps.unlock --check-unused,
      # format --check-formatted, credo --strict, sobelow --config
      - run: mix lint

  test:
    name: Suite and complexity
    runs-on: ubuntu-24.04
    # The suite is 4 minutes on a laptop and can take 12 on a cold runner. A
    # hung VM should fail the gate, not occupy it for GitHub's six-hour default.
    timeout-minutes: 40
    # Matches the development database version, so a migration that only works
    # on one Postgres fails here rather than in production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # `mix cover` = test --cover --export-coverage default; the coverage it
      # exports is what the CRAP ranking below reads.
      - name: Suite with coverage
        run: mix cover
      - name: Complexity (CRAP) ranking
        run: mix complexity
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            cover/
            default.coverdata
          if-no-files-found: ignore
          retention-days: 14

  image:
    name: Image, scan, non-root, publish
    # The point of a gate is that the thing behind it cannot be reached before
    # it opens: the image is built, scanned and pushed only for a commit that
    # passed static analysis and the suite.
    needs: [lint, test]
    runs-on: ubuntu-24.04
    # The arm64 half is built under QEMU, which is the slow part.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Work out the tag
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          # Branch or tag name, and nothing else: `:main` moves with the
          # branch, `:v1.2.3` is the release. A commit tag would leave a new
          # image behind on every push and still not say which branch it came
          # from, so there are none.
          tag=$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g')

          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS"
            echo "${image}:${tag}"
            # main also answers to `latest`, so a deployment can follow either
            # the branch's name or the usual one.
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${image}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
      # Built for the runner's own architecture so Trivy and the uid check read
      # a real image rather than a manifest list — and so those two checks stay
      # fast. This is the amd64 half of what is published below.
      - name: Build linux/amd64 for the checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            # The ref, which is also the image tag: `main`, `v1.2.3`.
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CI_PROVIDER=github
            CI_WORKFLOW=${{ github.workflow }}
            CI_RUN_NUMBER=${{ github.run_number }}
            CI_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          # Only what this project can act on: a fixable OS package or library.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Run as an unprivileged user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint /usr/bin/id "${{ steps.image.outputs.ref }}" -u)
          echo "image runs as uid ${uid}"
          test "${uid}" -ne 0
          test "${uid}" = "10001"
      # One image per published tag, carrying both architectures: an Apple
      # Silicon laptop or an arm64 VM pulls a native build, x86 servers pull
      # theirs. arm64 is compiled here, under QEMU, which is why only the
      # publication path pays for it.
      - name: Set up QEMU for the arm64 build
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Publish linux/amd64 and linux/arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CI_PROVIDER=github
            CI_WORKFLOW=${{ github.workflow }}
            CI_RUN_NUMBER=${{ github.run_number }}
            CI_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
