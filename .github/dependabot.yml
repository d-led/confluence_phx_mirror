# Dependency updates as pull requests: one per ecosystem, weekly, and the CI
# workflow above is what decides whether they land.
#
# The Dockerfile takes its base images as build arguments (ELIXIR_VERSION,
# OTP_VERSION, DEBIAN_VERSION, NODE_VERSION) rather than as literal `FROM`
# tags, so dependabot cannot see them; bump them by hand — they are the four
# lines at the top of the Dockerfile, and CI scans the result either way.

version: 2

updates:
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hex:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/assets"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/deploy/fly/proxy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # The desktop tool's Rust graph is watched for alerts, not bumped: every crate
  # in it comes from `tauri`, and tauri is the thing that decides when they move.
  # `glib` 0.18.5 carries GHSA-wrw7-89jp-8q8g. The fixed releases exist — `gtk`
  # 0.19.0 asks for `glib ^0.22` — but `tauri` pins `gtk ^0.18`, whose own `glib`
  # requirement is `^0.18`, so a bump cannot be made here and a bot opening that
  # PR every week would be noise. The reasoning and the condition for removing
  # this block are in docs/design-notes.md, "Known limitations".
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: glib
        versions: ["< 0.20.0"]
