# Postgres settings the mirror's load tests were measured with.
#
# Apply by appending to postgresql.conf and restarting, or as `-c name=value`
# flags on the server command (docker-compose `command:`, systemd, patched
# postgresql.auto.conf via ALTER SYSTEM).
#
# The read path is short queries against a corpus that fits in memory, so these
# are mostly about memory and connection count, not about parallelism: see
# "Sizing the connection pool" in docs/operations.md for the measurements.

# Enough room for replicas × POOL_COUNT × POOL_SIZE plus migrations, an
# operator's psql and Oban's own use of the same pool.
max_connections = 2000
superuser_reserved_connections = 5

# A quarter of RAM on a dedicated 16 GB host; leave it smaller when the
# database shares the machine with the application and the load generator.
shared_buffers = 2GB

# An estimate for the planner of what the OS can cache — not an allocation.
effective_cache_size = 8GB

# Per sort/hash node per connection: 2000 connections × several nodes is how a
# generous work_mem turns into an OOM.
work_mem = 4MB
maintenance_work_mem = 256MB

max_worker_processes = 16
max_parallel_workers = 16
# Readers need cores too; two workers per plan is enough for this workload.
max_parallel_workers_per_gather = 2

# SSD.
random_page_cost = 1.1
# Must stay 0 on macOS: Postgres refuses to start on platforms without
# posix_fadvise(). On Linux 200 is a reasonable value.
effective_io_concurrency = 0

# Bulk sync writes benefit; checkpoints stay out of the read path.
wal_compression = on
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

autovacuum_max_workers = 4

# The only way to know which query to fix next.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
