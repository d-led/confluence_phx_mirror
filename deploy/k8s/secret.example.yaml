# Copy to a file you do not commit (it is gitignored as deploy/k8s/secret.yaml),
# fill it in, and apply it before the Deployments.
#
#   kubectl apply -f deploy/k8s/secret.yaml
#
# Generating the two random values:
#
#   python3 -c 'import secrets; print(secrets.token_urlsafe(48))'                    # secret-key-base, release-cookie
#   python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())'  # cookie-secret
#
# cookie-secret has to be URL-safe base64 of exactly 16, 24 or 32 bytes:
# oauth2-proxy decodes it, and standard base64's `+`/`/` are rejected.

apiVersion: v1
kind: Secret
metadata:
  name: confluence-mirror
  namespace: confluence-mirror
type: Opaque
stringData:
  database-url: postgres://user:password@postgres:5432/confluence_mirror
  secret-key-base: replace-me-48-bytes-of-urlsafe-base64
  # Every node needs the same cookie to form a cluster.
  release-cookie: replace-me-48-bytes-of-urlsafe-base64
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
  namespace: confluence-mirror
type: Opaque
stringData:
  client-id: replace-me-github-oauth-client-id
  client-secret: replace-me-github-oauth-client-secret
  cookie-secret: replace-me-urlsafe-base64-of-32-bytes
